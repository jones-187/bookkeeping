# 编辑账目流程 E2E 测试
# 前提：需要先有一条账目记录

appId: com.jones.bookkeeping
name: 编辑账目流程

onFlowStart:
  - clearState

steps:
  # 1. 首先添加一条测试数据
  - launchApp:
      clearState: true
  - waitForAnimationToEnd:
      timeout: 3000

  # 添加一条账目用于编辑测试
  - tapOn:
      id: "add-entry-fab"
  - waitForAnimationToEnd:
      timeout: 1000

  - tapOn:
      id: "amount-input"
  - inputText: "50"

  - tapOn:
      id: "description-input"
  - inputText: "编辑测试原始数据"

  - tapOn:
      id: "submit-button"
  - waitForAnimationToEnd:
      timeout: 2000

  # 2. 点击刚添加的条目进入编辑页面
  - tapOn:
      text: "编辑测试原始数据"
  - waitForAnimationToEnd:
      timeout: 1000

  # 3. 验证编辑表单显示
  - assertVisible:
      id: "amount-input"

  # 4. 修改金额
  - tapOn:
      id: "amount-input"
  - clearText

  # 5. 输入新金额
  - inputText: "75"

  # 6. 修改描述
  - tapOn:
      id: "description-input"
  - clearText
  - inputText: "编辑测试已修改"

  # 7. 点击更新按钮
  - tapOn:
      id: "submit-button"

  # 8. 验证返回列表页
  - waitForAnimationToEnd:
      timeout: 2000
  - assertVisible:
      id: "entry-list"

  # 9. 验证修改后的条目显示
  - assertVisible:
      text: "编辑测试已修改"
