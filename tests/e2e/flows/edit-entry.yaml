appId: host.exp.exponent
name: Edit Entry Flow
---
# 0. Reset test data before starting
- runFlow: _reset.yaml

# 1. Tap FAB button to enter add page
- tapOn:
    id: "add-entry-fab"
- waitForAnimationToEnd:
    timeout: 2000

# 2. Create original test data
- tapOn:
    id: "amount-input"
- doubleTapOn:
    id: "amount-input"
- eraseText
- eraseText
- eraseText
- inputText: "50"

- tapOn:
    id: "description-input"
- doubleTapOn:
    id: "description-input"
- eraseText
- eraseText
- eraseText
- inputText: "TEST_EDIT_ORIGINAL"

- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 3. Verify original entry exists
- assertVisible:
    text: "TEST_EDIT_ORIGINAL"

# 4. Tap the entry to enter edit page
- tapOn:
    text: "TEST_EDIT_ORIGINAL"
- waitForAnimationToEnd:
    timeout: 2000

# 5. Verify edit form displays
- assertVisible:
    id: "amount-input"

# 6. Modify amount - select all and replace
- tapOn:
    id: "amount-input"
- doubleTapOn:
    id: "amount-input"
- eraseText
- eraseText
- eraseText
- inputText: "75"

# 7. Modify description - select all and replace
- tapOn:
    id: "description-input"
- doubleTapOn:
    id: "description-input"
- eraseText
- eraseText
- eraseText
- inputText: "TEST_EDIT_MODIFIED"

# 8. Submit the update
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 9. Verify return to list page
- assertVisible:
    id: "entry-list"

# 10. Verify modified entry displays
- assertVisible:
    text: "TEST_EDIT_MODIFIED"

# 11. Verify original entry no longer exists
- assertNotVisible:
    text: "TEST_EDIT_ORIGINAL"
