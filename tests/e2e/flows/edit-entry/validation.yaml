appId: host.exp.exponent
name: 编辑账目 - 验证错误测试
---
# 先创建测试数据
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
- tapOn:
    id: "amount-input"
- inputText: "100"
- tapOn:
    id: "description-input"
- inputText: "验证错误测试数据"
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 测试场景1: 金额改为0
- tapOn:
    text: "验证错误测试数据"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "amount-input"
- eraseText: 100
- inputText: "0"
- tapOn:
    id: "submit-button"

# 验证显示错误提示并停留在表单
- assertVisible:
    id: "submit-button"

# 取消编辑返回列表
- tapOn:
    text: "取消"
- waitForAnimationToEnd:
    timeout: 2000

# 测试场景2: 负数金额
- tapOn:
    text: "验证错误测试数据"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "amount-input"
- eraseText: 100
- inputText: "-50"
- tapOn:
    id: "submit-button"

# 验证显示错误提示
- assertVisible:
    id: "submit-button"

# 取消编辑
- tapOn:
    text: "取消"
- waitForAnimationToEnd:
    timeout: 2000

# 测试场景3: 空描述
- tapOn:
    text: "验证错误测试数据"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "description-input"
- eraseText: 100
- tapOn:
    id: "submit-button"

# 验证显示错误提示
- assertVisible:
    id: "submit-button"
