appId: host.exp.exponent
name: 编辑账目 - 边界值测试
---
# 测试场景1: 修改为最小金额
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
# 输入金额 100（使用拨号盘）
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-1"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500
# 输入描述
- tapOn:
    id: "description-input"
- inputText: "编辑边界测试"
# 提交
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 编辑为最小金额 0.01
- tapOn:
    text: "编辑边界测试"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-clear"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-dot"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-1"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000
# 验证金额更新为 0.01
- assertVisible:
    text: "¥0.01"

# 测试场景2: 修改为最大金额
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
# 输入金额 100
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-1"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500
# 输入描述
- tapOn:
    id: "description-input"
- inputText: "编辑最大金额"
# 提交
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 编辑为最大金额 999999.99
- tapOn:
    text: "编辑最大金额"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-clear"
# 输入 999999.99
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-dot"
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-9"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000
# 验证金额更新
- assertVisible:
    text: "¥999999.99"

# 测试场景3: 修改描述为1字符
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
# 输入金额 100
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-1"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500
# 输入描述
- tapOn:
    id: "description-input"
- inputText: "原始描述"
# 提交
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 编辑描述为1字符
- tapOn:
    text: "原始描述"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "description-input"
- eraseText: 100
- inputText: "X"
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000
# 验证描述更新
- assertVisible:
    text: "X"
# 验证金额未变化
- assertVisible:
    text: "¥100.00"
