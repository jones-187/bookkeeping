appId: host.exp.exponent
name: 删除账目 - 取消删除测试
---
# 测试场景: 取消删除操作

# 创建测试数据
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
- tapOn:
    id: "amount-input"
- inputText: "50"
- tapOn:
    id: "description-input"
- inputText: "取消删除测试"
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 验证数据存在
- assertVisible:
    text: "取消删除测试"

# 进入编辑页面
- tapOn:
    text: "取消删除测试"
- waitForAnimationToEnd:
    timeout: 2000

# 点击删除按钮
- tapOn:
    id: "delete-button"
- waitForAnimationToEnd:
    timeout: 1000

# 验证确认对话框显示
- assertVisible:
    text: "确认删除"

# 点击取消
- tapOn:
    text: "取消"
- waitForAnimationToEnd:
    timeout: 2000

# 验证仍在编辑页面
- assertVisible:
    id: "entry-form"

# 返回列表
- tapOn:
    text: "返回"
- waitForAnimationToEnd:
    timeout: 2000

# 验证数据仍然存在
- assertVisible:
    text: "取消删除测试"
