appId: host.exp.exponent
name: 删除账目 - 正常流程
---
# ==================== Given ====================
# 已有一条测试数据
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
# 输入金额 30（使用拨号盘）
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-3"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500
# 输入描述
- tapOn:
    id: "description-input"
- inputText: "待删除数据"
# 提交
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 验证数据已创建（同时验证描述和金额）
- assertVisible:
    text: "待删除数据"
- assertVisible:
    text: "¥30.00"

# ==================== When ====================
# 点击进入编辑页面
- tapOn:
    text: "待删除数据"
- waitForAnimationToEnd:
    timeout: 2000

# 验证删除按钮存在
- assertVisible:
    id: "delete-button"

# 点击删除按钮
- tapOn:
    id: "delete-button"
- waitForAnimationToEnd:
    timeout: 1000

# 确认删除对话框
- assertVisible:
    text: "确认删除"
- tapOn:
    text: "删除"
- waitForAnimationToEnd:
    timeout: 3000

# ==================== Then ====================
# 验证返回列表
- assertVisible:
    id: "entry-list"

# 验证数据已删除（同时验证描述和金额都不存在）
- assertNotVisible:
    text: "待删除数据"
- assertNotVisible:
    text: "¥30.00"
