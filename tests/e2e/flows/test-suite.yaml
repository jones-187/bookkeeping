appId: host.exp.exponent
name: E2E Test Suite - Simplified
---
# Simplified E2E Test Suite

# 1. Reset app state (clean data + navigation)
- runFlow: _reset.yaml

# 2. Test: Add Entry
- tapOn:
    id: "add-entry-fab"
- waitForAnimationToEnd:
    timeout: 2000

# Fill form - Amount (use dial pad)
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-1"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500

# Fill form - Description
- tapOn:
    id: "description-input"
- inputText: "Test Entry"

- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# Verify (both description and amount)
- assertVisible:
    text: "Test Entry"
- assertVisible:
    text: "¥100.00"

# 6. Test: Edit Entry
- tapOn:
    text: "Test Entry"
- waitForAnimationToEnd:
    timeout: 2000

# Edit Amount (use dial pad)
- tapOn:
    id: "amount-input"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "dial-clear"
- tapOn:
    id: "dial-2"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-0"
- tapOn:
    id: "dial-confirm"
- waitForAnimationToEnd:
    timeout: 500

# Edit Description
- tapOn:
    id: "description-input"
- eraseText: 100
- inputText: "Updated Entry"

- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# Verify (both description and amount)
- assertVisible:
    text: "Updated Entry"
- assertVisible:
    text: "¥200.00"
- assertNotVisible:
    text: "Test Entry"
- assertNotVisible:
    text: "¥100.00"

# 7. Test: Delete Entry
- tapOn:
    text: "Updated Entry"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: "delete-button"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: "删除"
- waitForAnimationToEnd:
    timeout: 3000

# Verify
- assertNotVisible:
    text: "Updated Entry"
- assertNotVisible:
    text: "¥200.00"
