appId: host.exp.exponent
name: Add Entry Flow
---
# 0. Reset test data before starting
- runFlow: _reset.yaml

# 1. Tap FAB button to enter add page
- tapOn:
    id: "add-entry-fab"
- waitForAnimationToEnd:
    timeout: 2000

# 2. Verify add form displays by checking for type selector
- assertVisible:
    text: "支出"

# 3. Select income type
- tapOn:
    text: "收入"

# 4. Input amount (using testID) - tap, select all, clear, then input
- tapOn:
    id: "amount-input"
- doubleTapOn:
    id: "amount-input"
- eraseText
- eraseText
- eraseText
- inputText: "100.50"

# 5. Input description with unique test identifier
- tapOn:
    id: "description-input"
- doubleTapOn:
    id: "description-input"
- eraseText
- eraseText
- eraseText
- inputText: "TEST_ADD_001"

# 6. Input date (using testID) - select all then input
- tapOn:
    id: "date-input"
- doubleTapOn:
    id: "date-input"
- eraseText
- eraseText
- eraseText
- inputText: "2026-04-05"

# 7. Tap add button (using testID)
- tapOn:
    id: "submit-button"

# 8. Verify return to list page
- waitForAnimationToEnd:
    timeout: 3000

# 9. Verify specific new entry displays
- assertVisible:
    text: "TEST_ADD_001"

# 10. Verify amount is displayed correctly (format: ¥10050.00)
- assertVisible:
    text: "¥10050.00"
