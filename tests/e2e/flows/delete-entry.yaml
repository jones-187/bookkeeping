appId: host.exp.exponent
name: Delete Entry Flow
---
# 0. Reset test data before starting
- runFlow: _reset.yaml

# 1. Tap FAB button to enter add page
- tapOn:
    id: "add-entry-fab"
- waitForAnimationToEnd:
    timeout: 2000

# 2. Create test data to be deleted
- tapOn:
    id: "amount-input"
- doubleTapOn:
    id: "amount-input"
- eraseText
- eraseText
- eraseText
- inputText: "30"

- tapOn:
    id: "description-input"
- doubleTapOn:
    id: "description-input"
- eraseText
- eraseText
- eraseText
- inputText: "TEST_DELETE_TARGET"

- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# 3. Verify entry exists
- assertVisible:
    text: "TEST_DELETE_TARGET"

# 4. Tap entry to enter edit page
- tapOn:
    text: "TEST_DELETE_TARGET"
- waitForAnimationToEnd:
    timeout: 2000

# 5. Verify delete button displays
- assertVisible:
    id: "delete-button"

# 6. Tap delete button
- tapOn:
    id: "delete-button"
- waitForAnimationToEnd:
    timeout: 1000

# 7. Confirm delete dialog
- tapOn:
    text: "删除"
- waitForAnimationToEnd:
    timeout: 3000

# 8. Verify return to list page
- assertVisible:
    id: "entry-list"

# 9. Verify entry is deleted
- assertNotVisible:
    text: "TEST_DELETE_TARGET"
