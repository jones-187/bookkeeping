appId: host.exp.exponent
name: 添加账目 - 正常流程（收入）
---
# ==================== Given ====================
# 应用已启动，显示空列表
- runFlow: ../_reset.yaml

# 验证初始状态（使用文本而非 testID）
- assertVisible:
    text: "收入"

# ==================== When ====================
# 用户点击添加按钮
- tapOn:
    id: "add-entry-fab"
- waitForAnimationToEnd:
    timeout: 2000

# 验证进入表单页面（通过检查表单元素存在）
- assertVisible:
    text: "支出"  # 默认类型为支出

# 切换为收入类型
- tapOn:
    text: "收入"

# 验证表单初始状态
- assertVisible:
    id: "amount-input"
- assertVisible:
    id: "description-input"
- assertVisible:
    id: "date-input"
- assertVisible:
    id: "submit-button"

# 填写表单
- tapOn:
    id: "amount-input"
- eraseText: 100
- inputText: "100.50"

- tapOn:
    id: "description-input"
- eraseText: 100
- inputText: "Salary Income"

# 提交表单
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# ==================== Then ====================
# 验证返回列表页面
- assertVisible:
    id: "entry-list"

# 验证账目显示
- assertVisible:
    text: "Salary Income"
- assertVisible:
    text: "+¥10050.00"

# 验证汇总更新
- assertVisible:
    text: "收入"
- assertVisible:
    text: "¥10050.00"
