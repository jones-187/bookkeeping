appId: host.exp.exponent
name: 添加账目 - 验证错误测试
---
# 测试场景1: 空金额
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
- tapOn:
    id: "submit-button"

# 验证显示错误提示并停留在表单页面（通过检查提交按钮仍存在）
- assertVisible:
    id: "submit-button"

# 测试场景2: 金额为0
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
- tapOn:
    id: "amount-input"
- inputText: "0"
- tapOn:
    id: "description-input"
- inputText: "金额为零测试"
- tapOn:
    id: "submit-button"

# 验证显示错误提示
- assertVisible:
    id: "entry-form"

# 测试场景3: 负数金额
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
- tapOn:
    id: "amount-input"
- doubleTapOn:
    id: "amount-input"
- eraseText
- eraseText
- eraseText
- inputText: "-50"
- tapOn:
    id: "description-input"
- inputText: "负数金额测试"
- tapOn:
    id: "submit-button"

# 验证显示错误提示
- assertVisible:
    id: "entry-form"

# 测试场景4: 空描述
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
- tapOn:
    id: "amount-input"
- inputText: "100"
- tapOn:
    id: "submit-button"

# 验证显示错误提示
- assertVisible:
    id: "entry-form"

# 测试场景5: 非数字金额
- runFlow: ../_reset.yaml
- tapOn:
    id: "add-entry-fab"
- tapOn:
    id: "amount-input"
- inputText: "abc"
- tapOn:
    id: "description-input"
- inputText: "非数字测试"
- tapOn:
    id: "submit-button"

# 验证显示错误提示
- assertVisible:
    id: "entry-form"
