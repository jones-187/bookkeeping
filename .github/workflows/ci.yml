name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"
          cache-dependency-path: src/app/package-lock.json

      - name: Install app dependencies
        working-directory: src/app
        run: npm ci

      - name: Check documentation
        run: bash scripts/check-docs.sh

      - name: Type-check app
        working-directory: src/app
        run: npm run typecheck

      - name: Lint app
        working-directory: src/app
        run: npm run lint

      - name: Test app
        working-directory: src/app
        run: npm test

      - name: Build native bundles
        working-directory: src/app
        run: npm run build
